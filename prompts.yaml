  **Example 7: Parsing JSON Output**
  **Thought:**
  *   **Metacognitive Reflection:** The `retrieve_chunks` tool returns a JSON string. I must parse it before I can use the data.
  *   **Reasoning:** I will import the `json` module, call the tool, and then use `json.loads()` to parse the output. Then I can work with the result as a normal Python list.
